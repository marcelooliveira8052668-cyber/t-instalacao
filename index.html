<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Sistemas | Automação & Segurança</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!--Botão flutuante do Whatsapp-->
    <a href="https://wa.me/5547..." target="-blank" class="whatsapp-float">
      <i class="fab fa-whatsapp"></i>
    </a>
    <!--cabeçalho de Navegação Rapida-->
    <header class="header">
      <div class="container header-flex">
        <div class="brand-info">
          <span class="brand-title">T Sistemas</span>
          <span class="brand-subtitle">Automação & Segurança</span>
        </div>
        <nav class="nav">
          <a href="#banner-principal">Início</a>
          <a href="#servicos">Serviços</a>
          <a href="#contato" class="btn-nav">Orçamento</a>
        </nav>
      </div>
    </header>
    <!--Banner principal-->
    <section id="banner-principal" class="banner-section">
      <div>
        <img
          src="foto1.jpg"
          height="500"
          alt="T Sistemas..."
          class="main-banner-img"
        />
      </div>
      <div class="banner-cta-bar">
        <div class="container banner-cta-bar-flex">
          <p>Precisa de um projeto de segurança completo</p>
          <a
            href="https://wa.me/5547..."
            target="-blank"
            class="btn-whatsapp-banner"
          >
            <i class="fab fa-whatsapp"></i>Chamar no Whatsapp (47) 99198-5274
          </a>
        </div>
      </div>
    </section>
    <!--Seção de Serviços Detalhados e video-->
    <section id="servicos" class="services container">
      <h2>Nossas Soluções</h2>
      <div class="services-grid">
        <!--Novo card de video interativo-->
        <div class="services-card video-card-wrapper">
          <div class="video-container">
            <video controls width="100%">
              <source src="video1.mp4" type="video/mp4" />
              Seu navegador não suporta a tag de video.
            </video>
          </div>
          <div class="video-card-content">
            <h3>Demonstração Prática</h3>
            <p>Clique no play para assistir ao funcionamento...</p>
          </div>
        </div>
      </div>
    </section>
    <section id="contato" class="contact-section">
      <div class="container">
        <h2>Solicite um Orçamento</h2>
        <form id="contractForm" class="contact-form">
          <div class="form-group">
            <label for="name">Seu Nome</label>
            <input
              type="text"
              id="name"
              required
              placeholder="Digite seu nome"
            />
          </div>
          <button type="submit" class="btn-primary full-width">
            Enviar Mensagem via Whatsapp
          </button>
        </form>
      </div>
    </section>
  </body>
</html>
